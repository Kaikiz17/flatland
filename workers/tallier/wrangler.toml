# Flatland vote robot: Cron Trigger worker (free plan, every 2 minutes). No public fetch handler.
# Secret (never committed):  npx wrangler secret put TALLIER_KEY   (key for 0xAa30...49c1)
name = "flatland-tallier"
main = "index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[triggers]
crons = ["*/2 * * * *"]

[observability]
enabled = true

[vars]
# RPC_URL = "https://<keyed endpoint, e.g. Alchemy>"   # optional, tried first (use a secret for keyed URLs)
APP_URL = "https://flatland.flatland.workers.dev"

[[kv_namespaces]]
binding = "KV"
id = "e6591923eec1421e99674804fd5e5be0"
